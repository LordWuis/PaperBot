name: Verify PaperBot
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paperbot
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: paperbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: SQLite and complete PDF parity suite
        run: python -m unittest discover -s tests -v
      - name: Real Postgres application and concurrency suite
        env:
          TEST_DATABASE_URL: postgresql://paperbot:test-only-password@localhost:5432/paperbot_test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check public/assets/app.js
